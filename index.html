<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LevelUp Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>LevelUp Analytics</h1>
            <p class="subtitle">Discover your readiness for your dream role</p>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Input Form Section -->
            <div id="formSection" class="form-section">
                <form id="analysisForm" class="form-card">
                    <h2>Analyze Your Profile</h2>
                    
                    <!-- Resume Upload -->
                    <div class="form-group">
                        <label for="resumeUpload" class="required">Resume (PDF/DOCX)</label>
                        <input 
                            type="file" 
                            id="resumeUpload" 
                            accept=".pdf,.docx"
                            required
                        >
                        <span id="resumeFileName" class="file-name"></span>
                    </div>

                    <!-- Job Role Input -->
                    <div class="form-group">
                        <label for="jobRole" class="required">Target Job Role</label>
                        <input 
                            type="text" 
                            id="jobRole" 
                            placeholder="e.g., Senior Full Stack Developer"
                            required
                        >
                    </div>

                    <!-- GitHub URL (Optional) -->
                    <div class="form-group">
                        <label for="githubUrl">GitHub Profile URL (Optional)</label>
                        <input 
                            type="url" 
                            id="githubUrl" 
                            placeholder="https://github.com/yourusername"
                        >
                    </div>

                    <!-- Analyze Button -->
                    <button type="submit" class="btn-analyze" id="analyzeBtn">
                        Analyze
                    </button>
                </form>
            </div>

            <!-- Loading Spinner Section -->
            <div id="loaderSection" class="loader-section hidden">
                <div class="spinner"></div>
                <p class="loader-text">Analyzing your profile...</p>
            </div>

            <!-- Results Section -->
            <div id="resultsSection" class="results-section hidden">
                <!-- Scores -->
                <div class="scores-row">
                    <div class="score-card">
                        <div class="score-label">Readiness Score</div>
                        <div class="score-value" id="scoreValue">0%</div>
                        <div class="score-bar">
                            <div class="score-fill" id="scoreFill"></div>
                        </div>
                    </div>

                    <div class="score-card score-card-ats">
                        <div class="score-label">ATS Score</div>
                        <div class="score-value" id="atsScoreValue">0%</div>
                        <div class="score-bar">
                            <div class="score-fill score-fill-ats" id="atsScoreFill"></div>
                        </div>
                    </div>
                </div>

                <!-- Matched Skills -->
                <div class="section-card">
                    <h3 class="section-title">✓ Matched Skills</h3>
                    <div class="skills-container" id="matchedSkills"></div>
                </div>

                <!-- Missing Skills -->
                <div class="section-card">
                    <h3 class="section-title">✗ Missing Skills</h3>
                    <div class="skills-container" id="missingSkills"></div>
                </div>

                <!-- Learning Path -->
                <div class="section-card">
                    <h3 class="section-title">📚 Learning Path</h3>
                    <ul class="learning-list" id="learningPath"></ul>
                </div>

                <!-- ATS Improvement Tips -->
                <div class="section-card">
                    <h3 class="section-title">📄 ATS Improvement Tips</h3>
                    <ul class="ats-list" id="atsTips"></ul>
                </div>

                <!-- GitHub Recommendations -->
                <div class="section-card">
                    <h3 class="section-title">🔗 GitHub Project Ideas</h3>
                    <ul class="github-list" id="githubRecommendations"></ul>
                </div>

                <!-- Back Button -->
                <button type="button" class="btn-back" id="backBtn">
                    ← Analyze Another Profile
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    </script>
    <script src="config.js"></script>
    <script src="analyzer.js"></script>
    <script src="script.js"></script>
</body>
</html>
